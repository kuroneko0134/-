[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proseka"
version = "0.1.0"
description = "Project SEKAI (プロジェクトセカイ) master-data integration: typed client, disk cache and CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["project-sekai", "proseka", "プロセカ", "rhythm-game", "master-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
proseka = "proseka.cli:main"

[project.urls]
Homepage = "https://github.com/kuroneko0134/-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
